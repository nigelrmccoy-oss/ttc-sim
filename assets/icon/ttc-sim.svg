<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Original icon for the unofficial TTC sim fan project: a generic subway train front in a tunnel mouth.
       No TTC logo, roundel, wordmark or livery artwork. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a3a"/><stop offset="1" stop-color="#0d141d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9b1b9"/><stop offset="0.5" stop-color="#e6eaee"/><stop offset="1" stop-color="#a9b1b9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a66"/><stop offset="1" stop-color="#0f1c29"/>
    </linearGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#ffd76a"/></radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#sky)"/>
  <!-- tunnel mouth -->
  <path d="M28 236 V120 A100 100 0 0 1 228 120 V236 Z" fill="#3a4350"/>
  <path d="M44 236 V124 A84 84 0 0 1 212 124 V236 Z" fill="#141a22"/>
  <!-- rails -->
  <path d="M96 236 L118 200 M160 236 L138 200" stroke="#8a929c" stroke-width="5" stroke-linecap="round"/>
  <!-- train front -->
  <path d="M70 206 V98 Q70 70 98 66 H158 Q186 70 186 98 V206 Z" fill="url(#body)" stroke="#5b636c" stroke-width="3"/>
  <rect x="84" y="82" width="88" height="56" rx="10" fill="url(#glass)"/>
  <path d="M90 90 L118 90 L100 130 L90 130 Z" fill="#ffffff" opacity="0.12"/>
  <rect x="108" y="70" width="40" height="8" rx="3" fill="#2a2f36"/>
  <rect x="112" y="72" width="32" height="4" rx="2" fill="#ffb347"/>
  <rect x="70" y="150" width="116" height="12" fill="#c8202f"/>
  <circle cx="92" cy="178" r="9" fill="url(#lamp)"/>
  <circle cx="164" cy="178" r="9" fill="url(#lamp)"/>
  <rect x="112" y="172" width="32" height="20" rx="3" fill="#3a4048"/>
  <rect x="66" y="204" width="124" height="10" rx="3" fill="#2a2f36"/>
</svg>
